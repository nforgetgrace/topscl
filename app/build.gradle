plugins { id 'com.android.application' }

android {
    namespace 'kr.toptap.android'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.toptap.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
